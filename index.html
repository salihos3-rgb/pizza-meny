<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pizza Meny">
<meta name="theme-color" content="#c41e3a">
<title>Pizza Meny</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root{--bg:#0e0e0f;--card:#1a1a1c;--text:#f2f2f2;--muted:#a8a8a8;--line:#2a2a2c;--red:#ff3b5c;--green:#30d158}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#0e0e0f;color:var(--text)}
body:has(.mask.on),body:has(.ovenwrap.on){overflow:hidden;position:fixed;width:100%;height:100%}
header{position:sticky;top:0;z-index:10;background:#c41e3a;padding:14px 12px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.1rem;font-weight:800;white-space:nowrap}
header .acts{display:flex;flex-shrink:0}
header p{font-size:.72rem;opacity:.9}
.iconbtn{background:rgba(255,255,255,.2);border:0;color:#fff;padding:10px 12px;border-radius:16px;font-weight:700;font-size:.82rem;margin-left:6px}
.iconbtn.hot{background:#ffc400;color:#111}
.wrap{padding:14px 16px 128px}
.search input{width:100%;padding:16px 48px 16px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:1.05rem}
.search{position:relative}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:18px;background:#2a2a2c;color:#fff;display:none}
.clear.on{display:block}
.chips,.cities{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip,.city{flex-shrink:0;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.city.on{background:#2a2a2c;border-color:#fff;color:#fff}
.count{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;position:relative}
.namebtn{background:0;border:0;color:inherit;font:inherit;text-align:left;width:calc(100% - 44px)}
.heart{position:absolute;top:12px;right:10px;background:0;border:0;font-size:1.5rem}
.meta{font-size:.86rem;color:var(--muted);margin:8px 0;display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:.72rem;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(48,209,88,.18);color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row a,.row button.act{flex:1;min-width:76px;text-align:center;text-decoration:none;padding:13px 0;border-radius:14px;font-weight:800;color:#fff;border:0}
.ring{background:var(--red)}.map{background:#1a73e8}.meny{background:rgba(48,209,88,.18);color:var(--green)!important}
.claim{background:#2a2a2c;color:var(--text)!important}
.page{display:none}.page.on{display:block}
.back{background:0;border:0;color:#fff;font-size:1.5rem;margin-right:8px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end}
.mask.on{display:flex}
.sheet{background:#161618;width:100%;border-radius:20px 20px 0 0;padding:8px 16px 40px;max-height:85dvh;overflow:auto}
.sheet p{color:var(--muted);margin-bottom:10px}
.sheet label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.sheet .go{width:100%;margin-top:12px;background:var(--red);border:0;color:#fff;padding:16px;border-radius:14px;font-weight:800}
.sheet .x{float:right;width:44px;height:44px;border:0;border-radius:22px;background:#161618;color:#fff;font-size:1.5rem}
.sheetcol{display:flex;flex-direction:column;overflow:hidden;max-height:85dvh}
.sheetbody{overflow:auto;flex:1;min-height:0}
.mex{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:70;width:44px;height:44px;border:0;border-radius:22px;background:#2a2a2c;color:#fff;font-size:1.45rem}
.owner{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;z-index:20;display:flex;gap:8px}
.owner button{flex:1;background:#1a1a1c;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:14px;font-weight:800}
.hp{position:absolute;left:-9999px;opacity:0}
.ovenwrap{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#050304}
.ovenwrap.on{display:flex}
.ovenx{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:61;width:44px;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.2);color:#fff;font-size:1.45rem}
.oven{width:min(360px,90vw);text-align:center}
.ovenbox{height:160px;border-radius:16px;background:#1a0c0a;border:4px solid #6a3a28;display:flex;align-items:center;justify-content:center;font-size:4rem}
.oven button.hero{width:100%;margin-top:14px;background:#ffc400;border:0;color:#111;padding:16px;border-radius:14px;font-weight:900}
.slumpgo,.oven button.side{width:100%;margin-top:8px;border:0;color:#fff;padding:14px;border-radius:14px;font-weight:700;background:#242426}
.slumpgo.main{background:#c41e3a}
.slumpgo.ovenbtn{background:#ffc400;color:#111}
.frow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.fbtn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;color:#fff;background:#2a2a2c}
.fbtn.ok{background:var(--green);color:#111}
.check{display:flex;gap:8px;margin-top:12px;color:var(--muted)}
.turtle,.flypie,.pizza,.door,.heat,.embers,.ovenbg,.spark{display:none}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <button class="back" id="back" style="display:none" onclick="goList()">‹</button>
    <div><h1 id="htitle">🍕 Pizza Meny</h1><p id="sub">Nummer. Meny. Klart.</p></div>
  </div>
  <div class="acts">
    <button class="iconbtn" onclick="openMe()">Jag</button>
    <button class="iconbtn hot" onclick="openSlump()">Slumpa</button>
    <button class="iconbtn q" onclick="openHelp()">?</button>
  </div>
</header>
<div class="page on" id="listPage"><div class="wrap">
  <div class="search">
    <input id="q" type="search" placeholder="Skriv stad..." oninput="onType()" onchange="rememberQ()" autocomplete="off">
    <button class="clear" id="clr" onclick="wipe()">✕</button>
  </div>
  <div class="chips" id="recent"></div>
  <div class="chips">
    <button class="chip on" data-f="all" onclick="setF('all')">Alla</button>
    <button class="chip" data-f="menu" onclick="setF('menu')">🍕 Meny</button>
    <button class="chip" data-f="phone" onclick="setF('phone')">📞 Tel</button>
    <button class="chip" data-f="near" onclick="setF('near')">📍 Nära</button>
    <button class="chip" data-f="fav" onclick="setF('fav')">❤️ Mina</button>
  </div>
  <div class="cities" id="cities"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div></div>
<div class="page" id="detailPage"><div class="wrap" id="detail"></div></div>
<div class="owner" id="ownerbar">
  <button onclick="openTip('saknas')">Saknas?</button>
  <button onclick="openOwner()">Äg din sida</button>
</div>
<div class="mask" id="mask"><div class="sheet">
  <button class="x" onclick="closeSheet()">✕</button>
  <h3 id="stitle">Äg</h3><p id="sdesc"></p>
  <input type="hidden" id="pid"><input class="hp" id="chp" tabindex="-1">
  <label>Namn</label><input id="cname"><label>Telefon</label><input id="cphone" type="tel">
  <label>E-post</label><input id="cmail" type="email"><label>Sajt</label><input id="cweb">
  <label class="check"><input type="checkbox" id="cboost"> Syns högre · 299 kr/mån</label>
  <button class="go" onclick="sendClaim()">Skicka</button>
</div></div>
<div class="mask" id="tipMask"><div class="sheet">
  <button class="x" onclick="document.getElementById('tipMask').classList.remove('on')">✕</button>
  <h3 id="tiptitle">Saknas?</h3><p id="tipdesc"></p>
  <input type="hidden" id="tipkind" value="saknas"><input type="hidden" id="tippid"><input class="hp" id="thp" tabindex="-1">
  <label>Namn</label><input id="tname"><label>Stad</label><input id="tcity">
  <label>Telefon</label><input id="tphone" type="tel"><label>Sajt</label><input id="tweb">
  <label>Övrigt</label><textarea id="tnote"></textarea>
  <button class="go" onclick="sendTip()">Skicka</button>
</div></div>
<div class="mask" id="slumpMask"><div class="sheet">
  <button class="x" onclick="document.getElementById('slumpMask').classList.remove('on')">✕</button>
  <h3>Slumpa</h3>
  <button class="slumpgo ovenbtn" onclick="ovenStart()">In i ugnen</button>
  <button class="slumpgo main" onclick="doSlump('any')">Valfri i Sverige</button>
  <button class="slumpgo" onclick="doSlump('city')">Här i staden</button>
  <button class="slumpgo" onclick="doSlump('fav')">Mina favoriter</button>
</div></div>
<div class="mask" id="meMask" onclick="if(event.target===this)this.classList.remove('on')">
  <button class="mex" onclick="document.getElementById('meMask').classList.remove('on')">✕</button>
  <div class="sheet sheetcol">
    <p id="mehint">Tagg och e-post.</p><p id="mebox"></p>
    <div class="sheetbody">
    <div id="meGuest">
      <label>Tagg / alias</label><input id="mename" maxlength="20">
      <label>E-post</label><input id="memail" type="email">
      <button class="go" onclick="saveMe()">Öppna konto</button>
      <div id="verifyBox" style="display:none"><p>Öppna maillänken här.</p>
        <button class="go" onclick="copyVerify()">Kopiera länk</button></div>
    </div>
    <div id="meIn" style="display:none">
      <label>Byt tagg</label><input id="retag" maxlength="20">
      <button class="go" onclick="changeTagg()">Spara tagg</button>
      <div id="friendsBox"><h3>Vänner</h3>
        <label>Sök tagg</label><input id="fsearch" maxlength="20">
        <button class="go" onclick="sendFriend()">Skicka förfrågan</button>
        <div id="fin"></div><div id="fout"></div><div id="fok"></div><div id="feats"></div>
      </div>
      <div id="del1"><button class="go" onclick="askDel()">Radera konto</button></div>
      <div id="del2" style="display:none">
        <p>Skriv din tagg.</p><input id="delconfirm">
        <button class="go" onclick="doDel()">Ja, radera</button>
        <button class="go" onclick="cancelDel()">Avbryt</button>
      </div>
    </div>
    <a class="go" href="/legal.html" style="display:block;text-align:center;text-decoration:none;background:#2a2a2c;color:#fff;padding:16px;border-radius:14px;margin-top:12px">Villkor</a>
    <button class="go" style="background:#2a2a2c" onclick="openContact()">Kontakt</button>
    </div>
  </div>
</div>
<div class="mask" id="helpMask"><div class="sheet">
  <button class="x" onclick="document.getElementById('helpMask').classList.remove('on')">✕</button>
  <h3 id="helptitle">Pizza Meny</h3>
  <div id="helpApp"><p>Pizzeria, nummer, meny. Slumpa.</p></div>
  <div id="helpOwner" style="display:none"></div>
  <button class="go" onclick="document.getElementById('helpMask').classList.remove('on')">Ok</button>
</div></div>
<div class="mask" id="contactMask"><div class="sheet">
  <button class="x" onclick="document.getElementById('contactMask').classList.remove('on')">✕</button>
  <h3>Kontakt</h3><p>pizzameny.app@gmail.com</p>
  <input class="hp" id="hp" tabindex="-1">
  <label>Namn</label><input id="kname"><label>E-post</label><input id="kmail" type="email">
  <label>Meddelande</label><textarea id="kmsg"></textarea>
  <button class="go" onclick="sendContact()">Skicka</button>
</div></div>
<div class="ovenwrap" id="oven">
  <button class="ovenx" onclick="ovenDismiss()">✕</button>
  <div class="ovenbg"></div><div class="turtle" id="turtle"></div><div class="flypie" id="flypie"></div>
  <div class="oven">
    <div class="ovenstage"><div class="ovenbox"><span class="pizza" id="ovenPizza">🍕</span><div class="door" id="door"></div></div></div>
    <h2 id="ovenTitle">Ugnen</h2><p id="ovenSub"></p>
    <div id="ovenActs" style="display:none">
      <button class="hero" onclick="ovenOpen()">Öppna pizzerian</button>
      <button class="side" id="ovenRing">Ring</button>
      <button class="side" onclick="ovenAgain()">En gång till</button>
    </div>
  </div>
</div>
<script src="app.js?v=20260924t"></script>
</body>
</html>
