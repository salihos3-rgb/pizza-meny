<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pizza Meny">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Pizza Meny</title>
<meta name="theme-color" content="#c41e3a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Hitta pizzeria, nummer och meny. Slumpa. Spara favoriter. Sverige.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cmmnqckszwgsvaaawouw.supabase.co; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'">
<link rel="preconnect" href="https://cmmnqckszwgsvaaawouw.supabase.co" crossorigin>
<style>
:root{--bg:#0e0e0f;--card:#1a1a1c;--text:#f2f2f2;--muted:#a8a8a8;--line:#2a2a2c;--red:#ff3b5c;--green:#30d158}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 500px at 50% -10%,#3a1520 0%,#0e0e0f 55%);color:var(--text)}
body:has(.mask.on),body:has(.ovenwrap.on){overflow:hidden;position:fixed;width:100%;height:100%}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#c41e3a,#a01830);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.15rem;font-weight:800;white-space:nowrap}
header .acts{display:flex;flex-shrink:0;align-items:center}
header p{font-size:.72rem;opacity:.9}
.iconbtn{background:rgba(255,255,255,.2);border:0;color:#fff;padding:10px 12px;border-radius:16px;font-weight:700;font-size:.82rem;margin-left:6px}
.iconbtn.hot{background:#ffc400;color:#111}
.iconbtn.q{min-width:42px;font-size:1.05rem;font-weight:900}
.wrap{padding:14px 16px 128px}
.search{position:relative}
.search input{width:100%;padding:16px 48px 16px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:1.05rem}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:18px;background:#2a2a2c;color:#fff;display:none}
.clear.on{display:block}
.chips,.cities{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip,.city{flex-shrink:0;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.9rem;font-weight:700}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.city.on{background:#2a2a2c;border-color:#fff;color:#fff}
.count{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;position:relative}
.namebtn{background:0;border:0;color:inherit;font:inherit;text-align:left;width:calc(100% - 44px)}
.namebtn h2{font-size:1.12rem}
.heart{position:absolute;top:12px;right:10px;background:0;border:0;font-size:1.5rem}
.meta{font-size:.86rem;color:var(--muted);margin:8px 0;display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:.72rem;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(48,209,88,.18);color:var(--green)}
.badge.s{background:rgba(255,196,0,.18);color:#ffc400}
.desc{font-size:.88rem;color:var(--muted);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row a,.row button.act{flex:1;min-width:76px;text-align:center;text-decoration:none;padding:13px 0;border-radius:14px;font-weight:800;font-size:.88rem;color:#fff;border:0}
.ring{background:var(--red)}.map{background:#1a73e8}.meny{background:rgba(48,209,88,.18);color:var(--green)!important}
.claim{background:#2a2a2c;color:var(--text)!important}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:1.05rem}
.page{display:none}.page.on{display:block}
.back{background:0;border:0;color:#fff;font-size:1.5rem;margin-right:8px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:none;align-items:flex-end}
.mask.on{display:flex}
.sheet{background:#161618;width:100%;border-radius:20px 20px 0 0;padding:8px 16px 40px;max-height:85dvh;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet h3{margin-bottom:6px;font-size:1.25rem}
.sheet p{color:var(--muted);font-size:.92rem;margin-bottom:10px}
.sheet label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:1.02rem}
.sheet textarea{min-height:72px}
.sheet .go{width:100%;margin-top:12px;background:var(--red);border:0;color:#fff;padding:16px;border-radius:14px;font-weight:800;font-size:1rem}
.sheet .x{position:sticky;top:0;float:right;z-index:8;width:44px;height:44px;border:0;border-radius:22px;background:#161618;color:#fff;font-size:1.5rem;font-weight:800}
.sheetcol{display:flex;flex-direction:column;overflow:hidden;padding:12px 16px 0;max-height:85dvh}
.sheethead{flex-shrink:0;padding:4px 0 8px}
.sheethead .top{display:flex;align-items:center;justify-content:space-between}
.sheethead h3{margin:0}
.sheethead .x{float:none;position:static}
.sheetbody{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:8px 0 40px}
.mex{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:70;width:44px;height:44px;border:0;border-radius:22px;background:#2a2a2c;color:#fff;font-size:1.45rem;font-weight:800}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--muted);font-size:.85rem}
.owner{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;z-index:20;display:flex;gap:8px}
.owner button{flex:1;background:#1a1a1c;border:1px solid var(--line);color:var(--text);padding:14px 8px;border-radius:14px;font-weight:800;font-size:.88rem}
.stars{letter-spacing:3px;font-size:1.3rem;margin:8px 0}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.price{color:#ffc400;font-weight:800}
.hp{position:absolute;left:-9999px;height:0;width:0;opacity:0}
.ovenwrap{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#050304}
.ovenwrap.on{display:flex;animation:fadein .25s ease}
.ovenx{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:61;width:44px;height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.2);color:#fff;font-size:1.45rem;font-weight:800;line-height:1}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.frow b{font-size:1rem}
.frow span{color:var(--muted);font-size:.82rem;display:block}
.fbtn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:.8rem;color:#fff;background:#2a2a2c}
.fbtn.ok{background:var(--green);color:#111}
.fbtn.bad{background:#3a1518;color:#ff8a9a}
.danger{margin-top:18px;padding-top:8px;border-top:1px solid var(--line)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ovenbg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 70%,rgba(255,90,20,.28),transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(255,40,0,.18),transparent 50%)}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffc400;opacity:0;animation:spark 2.4s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:translateY(12px) scale(.4)}40%{opacity:.9;transform:translateY(-28px) scale(1)}80%{opacity:0}}
.oven{width:min(360px,90vw);text-align:center;position:relative;overflow:visible;z-index:2}
.ovenstage{position:relative;height:250px;overflow:visible}
.ovenbox{position:relative;height:220px;border-radius:18px 18px 12px 12px;background:linear-gradient(#4a2818,#1a0c0a 55%,#0c0605);border:4px solid #6a3a28;box-shadow:0 0 60px rgba(255,90,20,.45),0 0 120px rgba(255,60,0,.18),inset 0 -20px 40px rgba(0,0,0,.5);overflow:hidden}
.embers{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 80%,rgba(255,90,20,.7),transparent 40%),radial-gradient(circle at 70% 85%,rgba(255,160,40,.5),transparent 38%),radial-gradient(circle at 50% 95%,rgba(255,220,80,.25),transparent 45%)}
.heat{position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(255,140,40,.28) 100%);animation:shimmer 1.2s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.4}to{opacity:1}}
.door{position:absolute;inset:8px 10px 28px;border-radius:10px;background:linear-gradient(#2c1614,#120808);border:2px solid #8a4a32;display:flex;align-items:center;justify-content:center;font-size:3.2rem;transform-origin:bottom;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s;box-shadow:inset 0 8px 18px rgba(255,180,80,.15)}
.door.shut{transform:scaleY(.06);opacity:.3}
.pizza{position:absolute;left:50%;bottom:42px;transform:translateX(-50%) scale(.2);font-size:4rem;opacity:0;transition:transform .55s cubic-bezier(.2,1.2,.3,1),opacity .4s}
.pizza.show{transform:translateX(-50%) scale(1);opacity:1}
.oven h2{margin:18px 0 6px;font-size:1.4rem}
.oven p{color:var(--muted)}
.oven button.hero{width:100%;margin-top:14px;background:linear-gradient(180deg,#ffc400,#e08a00);border:0;color:#111;padding:16px;border-radius:14px;font-weight:900;font-size:1.05rem}
.oven button.side{width:100%;margin-top:8px;background:#1a1a1c;border:1px solid #2a2a2c;color:#fff;padding:13px;border-radius:14px;font-weight:700}
.oven button.ghost{width:100%;margin-top:6px;background:0;border:0;color:var(--muted);padding:10px;font-weight:700}
.slumpgo{width:100%;margin-top:8px;border:0;color:#fff;padding:16px;border-radius:14px;font-weight:800;font-size:1rem}
.slumpgo.main{background:linear-gradient(180deg,#ff4d6d,#c41e3a);box-shadow:0 8px 24px rgba(196,30,58,.35)}
.slumpgo.dim{background:#242426}
.slumpgo.ovenbtn{background:linear-gradient(180deg,#ffc400,#e08a00);color:#111;margin-top:16px}
.turtle{position:absolute;left:-130px;bottom:6px;width:96px;height:72px;z-index:8;image-rendering:pixelated;pointer-events:none;transition:left .85s cubic-bezier(.2,.8,.2,1),opacity .3s}
.turtle.in,.turtle.go{left:8px}
.turtle svg{width:96px;height:72px;display:block;overflow:visible}
.turtle .held{transform-origin:70px 18px;transition:transform .28s cubic-bezier(.2,1.4,.3,1),opacity .2s}
.turtle.done{left:-140px;opacity:0}
.turtle.toss .held{opacity:0;transform:translate(42px,-28px) rotate(25deg)}
.turtle.walk .leg{animation:leg .28s steps(2) infinite}
@keyframes leg{50%{transform:translateY(2px)}}
.flypie{position:absolute;left:78px;bottom:46px;font-size:1.7rem;z-index:9;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 0 #000)}
.flypie.go{animation:tossin .55s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes tossin{0%{opacity:1;transform:translate(0,0) scale(1) rotate(-10deg)}55%{opacity:1;transform:translate(118px,-78px) scale(1.15) rotate(18deg)}100%{opacity:0;transform:translate(148px,-52px) scale(.4) rotate(40deg)}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <button class="back" id="back" style="display:none" onclick="goList()">‹</button>
    <div><h1 id="htitle">🍕 Pizza Meny</h1><p id="sub">Nummer. Meny. Klart.</p></div>
  </div>
  <div class="acts">
    <button class="iconbtn" onclick="openMe()">Jag</button>
    <button class="iconbtn hot" onclick="openSlump()">Slumpa</button>
    <button class="iconbtn q" onclick="openHelp()" aria-label="Om appen">?</button>
  </div>
</header>
</body>
</html>
